name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install --legacy-peer-deps

      - name: Allinea le versioni Expo
        run: npx expo install --fix -- --legacy-peer-deps

      - name: Genera il progetto Android
        run: npx expo prebuild --platform android --no-install

      - name: Imposta Gradle (memoria e architetture)
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' gradle.properties

      - name: Compila l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aeronav-team-apk
          path: android/app/build/outputs/apk/release/app-release.apk
