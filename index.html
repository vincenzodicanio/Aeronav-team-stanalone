<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AeroTeam Nav - Live Fleet Map</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Barra superiore stato volo & team -->
  <header class="hud-top">
    <div class="brand">
      <span class="radar-dot" id="gps-status-dot"></span>
      <div>
        <h1>AEROTEAM</h1>
        <small id="gps-status-text">In attesa GPS...</small>
      </div>
    </div>

    <div class="team-controls">
      <input type="text" id="callsign-input" placeholder="Callsign (es. I-ABCD)" maxlength="10" />
      <input type="text" id="team-code-input" placeholder="Codice Team (es. VOLO1)" maxlength="12" />
      <button id="btn-join-team" class="btn-primary">ENTRA</button>
    </div>
  </header>

  <!-- Mappa a schermo intero -->
  <main id="map"></main>

  <!-- Telemetria personale (Bottom Left) -->
  <section class="hud-telemetry">
    <div class="metric">
      <span class="label">GS (KT)</span>
      <span class="value" id="val-speed">0</span>
    </div>
    <div class="metric">
      <span class="label">ALT (FT)</span>
      <span class="value" id="val-alt">---</span>
    </div>
    <div class="metric">
      <span class="label">HDG</span>
      <span class="value" id="val-hdg">000°</span>
    </div>
    <div class="metric coords">
      <span class="label">POSIZIONE</span>
      <span class="value-sm" id="val-coords">--.-----, --.-----</span>
    </div>
  </section>

  <!-- Pannello membri del Team (Bottom Right) -->
  <aside class="hud-team-list" id="team-panel">
    <div class="panel-header">
      <span>MEMBRI TEAM (<span id="team-count">0</span>)</span>
      <button id="btn-sim" class="btn-sim" title="Attiva/Disattiva traffico simulato per test a terra">SIM: OFF</button>
    </div>
    <ul id="members-list">
      <li class="empty-msg">Inserisci un Codice Team per condividere la posizione.</li>
    </ul>
  </aside>

  <!-- Pulsante centra mappa -->
  <button id="btn-center" class="btn-fab" title="Centra sulla mia posizione">⌖</button>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
